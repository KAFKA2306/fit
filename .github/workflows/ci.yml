name: Normalize source

on:
  push:
    branches: [audit/verify-existing-toolchain-20260819]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Install locked environment
        run: uv sync --locked --dev
      - name: Apply existing Ruff configuration
        run: |
          uv run ruff check src --fix
          uv run ruff format src
      - name: Commit canonical formatting when needed
        run: |
          if git diff --quiet -- src; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: apply existing Ruff formatting"
          git push
